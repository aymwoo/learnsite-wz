name: Docker Environment Tests

on:
  workflow_run:
    workflows: ["Release Build and Publish"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Get Alpha Release
        id: release
        run: |
          # 优先获取alpha版本
          ALPHA_TAGS=$(gh release list --repo ${{ github.repository }} --json tagName --jq '.[] | select(.tagName | startswith("alpha-")) | .tagName' | sort -r)
          if [ ! -z "$ALPHA_TAGS" ]; then
            TAG_NAME=$(echo "$ALPHA_TAGS" | head -1)
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          else
            # 如果没有alpha版本，获取最新版本
            TAG_NAME=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName')
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download Release Asset
        run: |
          gh release download ${{ steps.release.outputs.tag_name }} --repo ${{ github.repository }} --pattern "*.zip"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract Release
        run: |
          unzip -o learnsite-*.zip -d .

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Run MS SQL Server in Docker
        run: |
          docker run -d --name learnsite-mssql -e 'ACCEPT_EULA=Y' -e "MSSQL_SA_PASSWORD=YourStrong!Passw0rd" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          echo "Waiting for SQL Server to start..."
          sleep 20

      - name: Install Mono and XSP4
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg
          sudo gpg --homedir /tmp --no-default-keyring --keyring /usr/share/keyrings/mono-official-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          echo "deb [signed-by=/usr/share/keyrings/mono-official-archive-keyring.gpg] https://download.mono-project.com/repo/ubuntu stable-focal main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt-get update
          sudo apt-get install -y mono-complete mono-xsp4

      - name: Initialize Database
        run: |
          if [ -f "sql/learnsite.sql" ]; then
            docker cp sql/learnsite.sql learnsite-mssql:/tmp/learnsite.sql
            docker exec learnsite-mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -C -Q "CREATE DATABASE [learnsite];"
            docker exec learnsite-mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -C -d learnsite -i /tmp/learnsite.sql
          else
            echo "[WARNING] sql/learnsite.sql not found, skipping database initialization"
          fi

      - name: Update web.config for Docker test
        run: |
          if [ -f "web.config" ]; then
            sed -i 's/Data Source=127.0.0.1;/Data Source=localhost;/g' web.config
            echo "[INFO] Updated web.config connection string"
          else
            echo "[WARNING] web.config not found, skipping configuration update"
          fi

      - name: Check directory structure and files
        run: |
          echo "=== Directory Structure ==="
          ls -la
          echo "=== Bin Directory ==="
          ls -la Bin/ 2>/dev/null || echo "Bin directory not found"
          echo "=== Web.config ==="
          ls -la web.config 2>/dev/null || echo "web.config not found"
          echo "=== SQL Directory ==="
          ls -la sql/ 2>/dev/null || echo "sql directory not found"

      - name: Check port 8080 before start
        run: |
          echo "=== Port 8080 Status Before Start ==="
          netstat -tuln | grep 8080 || echo "Port 8080 is not in use"

      - name: Start Web Service with explicit error handling
        run: |
          echo "=== Starting XSP4 Web Server ==="
          # 直接在前台运行XSP4，捕获所有输出
          timeout 30s xsp4 --port 8080 --address 0.0.0.0 --verbose > web.log 2>&1 &
          XSP4_PID=$!
          echo "XSP4 started with PID: $XSP4_PID"
          sleep 10
          # 检查进程是否仍在运行
          if ps -p $XSP4_PID > /dev/null; then
            echo "XSP4 is running"
          else
            echo "XSP4 process has exited"
            echo "=== XSP4 Error Logs ==="
            cat web.log
          fi

      - name: Check port 8080 after start
        run: |
          echo "=== Port 8080 Status After Start ==="
          netstat -tuln | grep 8080 || echo "Port 8080 is not listening"

      - name: Check XSP4 process
        run: |
          echo "=== XSP4 Process Status ==="
          ps aux | grep xsp4 | grep -v grep || echo "XSP4 process not found"

      - name: Show XSP4 logs
        run: |
          echo "=== XSP4 Server Logs ==="
          cat web.log || echo "No web.log found"

      - name: Test web service access
        run: |
          echo "=== Testing Web Service Access ==="
          for i in {1..5}; do
            echo "Attempt $i:"
            curl -v http://localhost:8080
            if [ $? -eq 0 ]; then
              echo "SUCCESS: Web service accessible"
              break
            fi
            echo "Waiting 5 seconds..."
            sleep 5
          done

      - name: Final web service test
        run: |
          echo "=== Final Web Service Test ==="
          curl -s http://localhost:8080 > /dev/null
          if [ $? -eq 0 ]; then
            echo "[SUCCESS] Web service is accessible"
          else
            echo "[ERROR] Web service is not accessible"
            echo "=== Final XSP4 Logs ==="
            cat web.log || echo "No web.log found"
            exit 1
          fi

      - name: Cleanup
        run: |
          docker stop learnsite-mssql || true
          docker rm learnsite-mssql || true
