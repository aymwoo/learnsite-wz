name: Docker Environment Tests

on:
  workflow_run:
    workflows: ["Release Build and Publish"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Get Latest Release
        id: release
        run: |
          TAG_NAME=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download Release Asset
        run: |
          gh release download ${{ steps.release.outputs.tag_name }} --pattern "*.zip"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract Release
        run: |
          unzip -o learnsite-*.zip -d .

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Run Preconfigured MSSQL Database in Docker
        run: |
          docker run -d --name learnsite-mssql -e 'ACCEPT_EULA=Y' -e "MSSQL_SA_PASSWORD=YourStrong!Passw0rd" -p 1433:1433 orzg/mssql-learnsite
          echo "Waiting for SQL Server to start..."
          sleep 20

      - name: Install Mono and XSP4
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg
          sudo gpg --homedir /tmp --no-default-keyring --keyring /usr/share/keyrings/mono-official-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          echo "deb [signed-by=/usr/share/keyrings/mono-official-archive-keyring.gpg] https://download.mono-project.com/repo/ubuntu stable-focal main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt-get update
          sudo apt-get install -y mono-complete mono-xsp4 mssql-tools unixodbc-dev

      - name: Make scripts executable
        run: |
          chmod +x start_web.sh run_tests.sh

      - name: Update web.config for Docker test
        run: |
          sed -i 's/Data Source=127.0.0.1;/Data Source=localhost;/g' web.config

      - name: Start Web Service
        run: |
          nohup bash start_web.sh 8080 > web.log 2>&1 &
          sleep 10

      - name: Check Web Service Status
        run: |
          curl -s http://localhost:8080 || echo "Web service not ready yet"

      - name: Run Tests
        run: ./run_tests.sh
        env:
          BASE_URL: http://localhost:8080

      - name: Cleanup
        run: |
          docker stop learnsite-mssql || true
          docker rm learnsite-mssql || true
