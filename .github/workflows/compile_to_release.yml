name: Release Tests

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type (latest / alpha)'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - alpha

jobs:
  test_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Make run_tests.sh executable
        run: chmod +x run_tests.sh

      - name: Run Unit Tests
        run: ./run_tests.sh --no-e2e

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: orzg/learnsite-web:${{ github.event.inputs.release_type }}

      - name: Zip Repository for GitHub Release
        run: zip -r learnsite-${{ github.event.inputs.release_type }}.zip . -x "*.git*" "node_modules/*" "TestResults/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_type }}-${{ github.run_number }}
          name: LearnSite ${{ github.event.inputs.release_type }} Build ${{ github.run_number }}
          files: learnsite-${{ github.event.inputs.release_type }}.zip
